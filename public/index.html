        <script>
            const items = document.querySelectorAll(".terminal-line");
            items.forEach((item) => {
                const text = item.getAttribute('data-text');
                const textArray = text.split("");
                let current = 0;
                setInterval(() => {
                    if (current < textArray.length) {
                        item.textContent = item.textContent + textArray[current];
                        current++;
                    }
                }, 75);
                console.log(text);
            });
            console.log(items);
        </script>
