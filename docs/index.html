<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esper Innovations</title>
  <meta name="description"
    content="Esper Innovations: software development consulting, and Deckard, a local-first second brain for Markdown notes in VS Code.">
  <meta name="theme-color" content="#16151C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Jura:wght@300;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #16151C;
      --surface: #1D1C25;
      --ink: #ECE6DA;
      --muted: #9C9486;
      --line: #2B2A36;
      --amber: #D4922C;
      --amber-soft: #D4922C1f;
      --display: "Jura", "Avenir Next", system-ui, sans-serif;
      --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 var(--body);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 6vh, 64px) 16px;
      gap: clamp(40px, 7vh, 72px)
    }

    .logo {
      width: min(100%, 560px);
      display: block
    }

    .logo img {
      width: 100%;
      height: auto;
      display: block
    }

    .card {
      display: flex;
      align-items: center;
      gap: 24px;
      width: min(100%, 520px);
      padding: 22px 26px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, box-shadow .15s
    }

    .card:hover,
    .card:focus-visible {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-soft);
      outline: none
    }

    .card img {
      width: 112px;
      height: 112px;
      flex: none
    }

    .card .text {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0
    }

    .card .eyebrow {
      font: 500 11px/1 var(--display);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--amber);
      margin: 0
    }

    .card h2 {
      font: 500 22px/1.2 var(--display);
      letter-spacing: .04em;
      margin: 0
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 15px
    }

    .card .go {
      color: var(--amber);
      font-size: 14px;
      margin-top: 2px
    }

    footer {
      font: 500 11px/1 var(--display);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted)
    }

    @media (max-width:560px) {
      .card {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px
      }
    }
  </style>
</head>

<body>
  <a class="logo" href="/" aria-label="Esper Innovations">
    <img src="images/esper-lockup.svg" alt="esper innovations" width="1000" height="378">
  </a>

  <a class="card" href="https://marketplace.visualstudio.com/items?itemName=esperinnovations.deckard-notes">
    <img src="images/deckard-lockup.svg" alt="" width="112" height="112">
    <div class="text">
      <span class="eyebrow">VS Code extension</span>
      <h2>Deckard</h2>
      <p>Your notes, tasks, and people, connected and kept local. Find what you wrote, chase down loose ends, and retire
        what's done.</p>
      <span class="go">deckard.esperinnovations.com &rarr;</span>
    </div>
  </a>

  <footer>&copy; 2026 Esper Innovations</footer>
</body>

</html>
